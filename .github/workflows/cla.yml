name: cla

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Contributor License Agreement
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci

      - name: Record a signature
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER_ID: ${{ github.event.comment.user.id }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENTED_AT: ${{ github.event.comment.created_at }}
        run: sh scripts/ci/cla.sh sign

      - name: Check the commit authors
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          NOTIFY: ${{ github.event.action == 'opened' }}
        run: sh scripts/ci/cla.sh check
