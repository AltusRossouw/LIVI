[package]
name = "gst-video-addon"
version = "0.1.0"
edition.workspace = true

# N-API addon behind require('gst-video'): compiles ../src/gst_video.cc and the
# platform companions unchanged. The cdylib is copied to
# native/gst-video/build/Release/gst_video.node by scripts/build-native.mjs.
[lib]
crate-type = ["cdylib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
napi-build = "2"
