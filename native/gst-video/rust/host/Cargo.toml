[package]
name = "gst-video-host"
version = "0.1.0"
edition.workspace = true

# The standalone livi-gst-host binary (Linux): the same C++ sources with
# LIVI_GST_HOST_STANDALONE, whose main() is the process entry point.
[[bin]]
name = "livi-gst-host"
path = "src/main.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
